name: Build and Package DSQL

on:
  workflow_dispatch: # Allow manual triggering
  push:
    branches: ["*"] # Run on all branch pushes
  pull_request:
    branches: ["*"] # Run on all pull requests

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Set up macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openssl@3 icu4c zip readline go

      - name: Set up Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex \
            bison \
            libreadline-dev \
            zlib1g-dev \
            libssl-dev \
            libicu-dev \
            build-essential \
            cmake \
            zip \
            rpm \
            patchelf

      - name: Build DSQL
        run: |
          chmod +x scripts/build-dsql.sh
          ./scripts/build-dsql.sh

      - name: Package for Distribution
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Test Package
        run: |
          chmod +x scripts/test-packaging.sh
          ./scripts/test-packaging.sh --test-only

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dsql-${{ matrix.os }}-${{ runner.arch }}
          path: build/postgres-dsql.zip

      - name: Upload DMG Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dsql-dmg-${{ runner.arch }}
          path: "build/*.dmg"

      - name: Upload RPM Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dsql-rpm-${{ matrix.os }}-${{ runner.arch }}
          path: "build/*.rpm"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/postgres-dsql.zip
            build/*.dmg
            build/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
